<!DOCTYPE html>
<html lang="az">
<head>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">

<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        ink: '#2c2966', 'ink-2': '#1b1940', 'ink-3': '#14122e',
        neon: '#00e5d4', lilac: '#7c6ff0', mist: '#f4f5fa', line: '#e6e8f2',

<style>
  @keyframes aurora {
    0%,100% { transform: translate(0,0) scale(1); }
    33%     { transform: translate(18%,-12%) scale(1.15); }
    66%     { transform: translate(-14%,10%) scale(0.95); }
  }
  .aurora-blob { animation: aurora 14s ease-in-out infinite; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #cfd3e6; border-radius: 99px; }
  :focus-visible { outline: 2px solid #00e5d4; outline-offset: 2px; border-radius: 6px; }
  @media (prefers-reduced-motion: reduce) { .aurora-blob { animation: none; } * { transition: none !important; } }

  /* Kartin cip effekti */
  .chip {
    background: linear-gradient(135deg, #d4af37 0%, #f4e5a0 40%, #d4af37 100%);
  }
  /* Bloklanmis kart - solgun */
  .card-blocked { filter: grayscale(0.7) brightness(0.85); }
</style>
</head>

<body class="bg-mist font-body text-ink-2 antialiased">

<div class="flex min-h-screen">

  <!-- ════════════ SOL PANEL ════════════ -->
  <aside class="hidden lg:flex w-64 shrink-0 flex-col bg-ink-2 text-white/70 px-5 py-6">
    <div class="flex items-center gap-2.5 px-2 mb-9">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-neon to-lilac grid place-items-center">
        <i data-lucide="gem" style="width:18px;height:18px" class="text-ink-2"></i>
      </div>
      <span class="font-display font-700 text-lg text-white tracking-tight">Amorabank</span>
    </div>

    <nav class="flex-1 space-y-1">
      <a href="amorabank-dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 hover:text-white transition text-sm">
        <i data-lucide="layout-dashboard" style="width:18px;height:18px"></i> Panel
      </a>
      <a href="amorabank-transfers.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 hover:text-white transition text-sm">
        <i data-lucide="arrow-left-right" style="width:18px;height:18px"></i> Köçürmələr
      </a>
      <a href="amorabank-cards.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 hover:text-white transition text-sm">
        <i data-lucide="credit-card" style="width:18px;height:18px"></i> Kartlar
      </a>
      <a href="amorabank-payments.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 hover:text-white transition text-sm">
        <i data-lucide="receipt" style="width:18px;height:18px"></i> Ödənişlər
      </a>
      <a href="amorabank-savings.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 hover:text-white transition text-sm">
        <i data-lucide="piggy-bank" style="width:18px;height:18px"></i> Yığım
      </a>
      <a href="amorabank-analytics.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 hover:text-white transition text-sm">
        <i data-lucide="pie-chart" style="width:18px;height:18px"></i> Analitika
      </a>
      <a href="amorabank-loans.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 hover:text-white transition text-sm">
        <i data-lucide="landmark" style="width:18px;height:18px"></i> Kreditlər

    </nav>

    <button id="logoutBtn" class="mt-4 flex items-center gap-3 px-3 py-2.5 rounded-xl hover:bg-white/5 hover:text-white transition text-sm">

    </button>
  </aside>


  <main class="flex-1 min-w-0 pb-24 lg:pb-0">

    <!-- ════════════ HEADER ════════════ -->
    <header class="sticky top-0 z-20 bg-mist/80 backdrop-blur-lg border-b border-line">
      <div class="flex items-center gap-3 px-5 lg:px-8 h-16">
        <div class="lg:hidden flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-neon to-lilac grid place-items-center">
            <i data-lucide="gem" style="width:15px;height:15px" class="text-ink-2"></i>
          </div>
          <span class="font-display font-700 text-ink">Amorabank</span>
        </div>

        <div class="hidden lg:block">
          <h1 class="font-display font-600 text-ink text-lg leading-tight">Kartlarım</h1>
          <p class="text-xs text-ink/50">Bank kartlarını idarə et</p>
        </div>

        <div class="flex-1"></div>

        <button id="newCardBtn" class="flex items-center gap-2 px-4 h-9 rounded-xl bg-ink text-white text-sm font-600 hover:bg-ink-2 active:scale-[.98] transition">
          <i data-lucide="plus" style="width:16px;height:16px"></i>
          <span class="hidden sm:inline">Yeni kart</span>
        </button>

        <a href="amorabank-dashboard.html" class="flex items-center gap-2 px-3.5 h-9 rounded-xl bg-white border border-line hover:border-ink/20 transition text-sm text-ink/70">
          <i data-lucide="arrow-left" style="width:15px;height:15px"></i>

        <div class="flex items-center gap-2.5 pl-2 lg:pl-3 lg:border-l border-line">

          <div class="hidden xl:block leading-tight">
            <p class="text-sm font-500 text-ink-2" id="userFullName">…</p>

      </div>

    <div class="px-5 lg:px-8 py-6">

      <p id="pageMsg" class="hidden mb-5 text-sm px-4 py-3 rounded-xl max-w-2xl"></p>

      <!-- Kartlar setki -->
      <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
        <div class="col-span-full py-16 text-center text-ink/35 text-sm">Kartlar yüklənir…</div>
      </div>

    </div>
  </main>
</div>


<!-- ════════════ YENI KART MODALI ════════════ -->
<div id="createModal" class="hidden fixed inset-0 z-50 grid place-items-center p-4 bg-ink-3/40 backdrop-blur-sm">
  <div class="bg-white rounded-2xl border border-line w-full max-w-md p-6 relative">
    <button id="closeCreate" class="absolute right-4 top-4 w-8 h-8 grid place-items-center rounded-lg hover:bg-mist transition">
      <i data-lucide="x" style="width:18px;height:18px" class="text-ink/50"></i>
    </button>

    <div class="w-12 h-12 rounded-2xl bg-neon/12 grid place-items-center mb-4">
      <i data-lucide="credit-card" style="width:22px;height:22px" class="text-teal-700"></i>
    </div>

    <h3 class="font-display font-600 text-ink text-lg">Yeni kart aç</h3>
    <p class="text-sm text-ink/50 mt-1 mb-5">Kartın bağlanacağı hesabı seçin.</p>

    <form id="createForm" class="space-y-4">
      <div>
        <label class="block text-xs font-500 text-ink/60 mb-1.5">Hesab</label>
        <select id="cardAccount" class="w-full h-12 px-3.5 rounded-xl border border-line bg-mist text-sm text-ink-2 focus:border-neon focus:bg-white outline-none transition"></select>
      </div>
      <button type="submit" class="w-full h-12 rounded-xl bg-ink text-white text-sm font-600 hover:bg-ink-2 active:scale-[.99] disabled:opacity-60 transition flex items-center justify-center gap-2">
        <i data-lucide="plus" style="width:16px;height:16px"></i> Kartı yarat
      </button>
    </form>
  </div>
</div>


<!-- ════════════ MOBIL NAV ════════════ -->
<nav class="lg:hidden fixed bottom-0 inset-x-0 z-30 bg-white border-t border-line px-2 py-2">
  <div class="flex justify-around">
    <a href="amorabank-dashboard.html" class="flex flex-col items-center gap-0.5 px-3 py-1 text-ink/40">
      <i data-lucide="layout-dashboard" style="width:20px;height:20px"></i>
      <span class="text-[10px]">Panel</span>
    </a>
    <a href="amorabank-transfers.html" class="flex flex-col items-center gap-0.5 px-3 py-1 text-ink/40">
      <i data-lucide="arrow-left-right" style="width:20px;height:20px"></i>
      <span class="text-[10px]">Köçür</span>
    </a>
    <a href="amorabank-cards.html" class="flex flex-col items-center gap-0.5 px-3 py-1 text-neon">
      <i data-lucide="credit-card" style="width:20px;height:20px"></i>
      <span class="text-[10px] font-500">Kartlar</span>
    </a>
    <button class="nav-soon flex flex-col items-center gap-0.5 px-3 py-1 text-ink/40">
      <i data-lucide="pie-chart" style="width:20px;height:20px"></i>
      <span class="text-[10px]">Analitika</span>
    </button>
  </div>
</nav>


<script>
/* ══════════════════════════════════════════════════════════════
   1. KONFIQURASIYA (dashboard ile eyni pattern)
   ══════════════════════════════════════════════════════════════ */
const API_BASE = "http://localhost:5150";
const getToken = () => localStorage.getItem("token");

if (!getToken()) window.location.href = "amorabank-auth.html";

async function api(path, options = {}) {
  const res = await fetch(API_BASE + path, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      "Accept-Language": "az",
      ...(getToken() ? { "Authorization": "Bearer " + getToken() } : {}),
      ...(options.headers || {}),
    },
  });
  // 401 - sessiya bitib, girise at
  if (res.status === 401) {
    localStorage.removeItem("token");
    localStorage.removeItem("refreshToken");
    window.location.href = "amorabank-auth.html";
    throw new Error("Sessiya bitib. Yenidən daxil olun.");
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || data.message || "Xəta baş verdi.");
  return data;
}

const formatIban = (s) => s ? s.replace(/(.{4})/g, '$1 ').trim() : '—';
const AZN = (n) => Number(n ?? 0).toLocaleString("az-AZ", { minimumFractionDigits: 2, maximumFractionDigits: 2 });


/* ══════════════════════════════════════════════════════════════
   2. GLOBAL VEZIYYET
   ══════════════════════════════════════════════════════════════ */
let cards = [];
let accounts = [];


/* ══════════════════════════════════════════════════════════════
   3. YUKLEME
   ══════════════════════════════════════════════════════════════ */
async function loadProfile() {
  try {
    const me = await api("/api/Auth/me");
    const name = me.fullName || me.email || "İstifadəçi";
    document.getElementById("userFullName").textContent = name;
    document.getElementById("userEmail").textContent = me.email ?? "";
    document.getElementById("avatar").textContent = name.charAt(0).toUpperCase();
  } catch (e) {
    console.error("Profil:", e.message);
  }
}

async function loadAccounts() {
  try {
    accounts = await api("/api/Account/my");
  } catch (e) {
    console.error("Hesablar:", e.message);
    accounts = [];
  }
  // modal-daki hesab secimini doldur
  const sel = document.getElementById("cardAccount");
  if (accounts.length) {
    sel.innerHTML = accounts.map(a =>
      `<option value="${a.id}">${a.type === 'Savings' ? 'Əmanət' : 'Cari'} • ${formatIban(a.accountNumber)}</option>`
    ).join("");
  } else {
    sel.innerHTML = `<option value="">Hesab yoxdur</option>`;
  }
}

async function loadCards() {
  const grid = document.getElementById("cardsGrid");
  grid.innerHTML = `<div class="col-span-full py-16 text-center text-ink/35 text-sm">Kartlar yüklənir…</div>`;
  try {
    const res = await api("/api/Card/my?Page=1&PageSize=20");
    // cavab {items:[...]} ya birbasa massiv ola biler
    cards = res.items ?? (Array.isArray(res) ? res : []);
  } catch (e) {
    console.error("Kartlar:", e.message);
    grid.innerHTML = `<div class="col-span-full py-16 text-center text-red-500 text-sm">${e.message}</div>`;
    return;
  }
  renderCards();
}


/* ══════════════════════════════════════════════════════════════
   4. RENDER
   ══════════════════════════════════════════════════════════════ */

// kartin nomresini maskala (backend maskeli ya tam gonderse de ise yarasin)
function maskNumber(card) {
  const raw = card.maskedNumber || card.cardNumber || card.number || card.pan || "";
  if (!raw) return "•••• •••• •••• ••••";
  const digits = String(raw).replace(/\s/g, "");
  const last4 = digits.slice(-4);
  return `•••• •••• •••• ${last4}`;
}

function cardStatus(card) {
  // status "Active"/"Blocked" ya reqem (1/2) ola biler
  const s = card.status;
  if (s === "Blocked" || s === 2) return "blocked";
  return "active";
}

function accountTypeLabel(card) {
  // kart hansi hesaba baglidir - hesabdan tipi tapmaga calis
  const acc = accounts.find(a => a.id === card.accountId);
  if (acc) return acc.type === "Savings" ? "Əmanət hesabı" : "Cari hesab";
  return card.accountType === "Savings" ? "Əmanət hesabı" : "Cari hesab";
}

function expiryLabel(card) {
  const e = card.expiryDate || card.expiry || card.expiresAt;
  if (!e) return "••/••";
  const d = new Date(e);
  if (isNaN(d)) return String(e);
  return `${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getFullYear()).slice(-2)}`;
}

function renderCards() {
  const grid = document.getElementById("cardsGrid");

  if (!cards.length) {
    grid.innerHTML = `
      <div class="col-span-full">
        <div class="bg-white rounded-2xl border border-dashed border-line py-16 px-6 text-center max-w-lg mx-auto">
          <div class="w-14 h-14 rounded-2xl bg-mist grid place-items-center mx-auto mb-4">
            <i data-lucide="credit-card" style="width:26px;height:26px" class="text-ink/30"></i>
          </div>
          <h3 class="font-display font-600 text-ink">Hələ kartınız yoxdur</h3>
          <p class="text-sm text-ink/45 mt-1.5 mb-5">İlk kartınızı açın — hesabınıza bağlanacaq.</p>
          <button onclick="openCreate()" class="inline-flex items-center gap-2 px-5 h-11 rounded-xl bg-ink text-white text-sm font-600 hover:bg-ink-2 transition">
            <i data-lucide="plus" style="width:16px;height:16px"></i> Kart aç
          </button>
        </div>
      </div>`;
    lucide.createIcons();
    return;
  }

  grid.innerHTML = cards.map(card => {
    const blocked = cardStatus(card) === "blocked";
    return `
    <div class="space-y-3">
      <!-- Kart gorunusu -->
      <div class="relative rounded-2xl overflow-hidden shadow-xl shadow-ink/10 ${blocked ? "card-blocked" : ""}">
        <div class="relative bg-gradient-to-br from-ink via-ink-2 to-ink-3 p-5 h-[200px]">
          <div class="aurora-blob absolute -top-16 -right-10 w-52 h-52 rounded-full blur-3xl opacity-40"
               style="background: radial-gradient(circle, #00e5d4 0%, transparent 65%)"></div>
          <div class="aurora-blob absolute -bottom-16 -left-6 w-44 h-44 rounded-full blur-3xl opacity-30"
               style="background: radial-gradient(circle, #7c6ff0 0%, transparent 65%); animation-delay:-6s"></div>

          <div class="relative flex flex-col h-full justify-between">
            <div class="flex items-start justify-between">
              <div class="chip w-10 h-7 rounded-md"></div>
              <span class="px-2 py-0.5 rounded-md text-[10px] font-600 ${blocked ? "bg-red-500/20 text-red-300" : "bg-neon/20 text-neon"}">
                ${blocked ? "Bloklu" : "Aktiv"}
              </span>
            </div>

            <div>
              <p class="font-mono text-white text-lg tracking-[0.2em]">${maskNumber(card)}</p>
            </div>

            <div class="flex items-end justify-between">
              <div>
                <p class="text-white/40 text-[9px] uppercase tracking-wider">Hesab</p>
                <p class="text-white/80 text-xs">${accountTypeLabel(card)}</p>
              </div>
              <div class="text-right">
                <p class="text-white/40 text-[9px] uppercase tracking-wider">Bitmə</p>
                <p class="text-white/80 text-xs font-mono">${expiryLabel(card)}</p>
              </div>
              <span class="font-display font-700 text-white/90 text-sm italic">amora</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Kart emelleri -->
      <div class="flex gap-2">
        ${blocked
          ? `<button onclick="unblockCard('${card.id}')" class="flex-1 h-10 rounded-xl bg-white border border-line text-sm font-500 text-teal-700 hover:border-neon transition flex items-center justify-center gap-1.5">
               <i data-lucide="lock-open" style="width:15px;height:15px"></i> Aktivləşdir
             </button>`
          : `<button onclick="blockCard('${card.id}')" class="flex-1 h-10 rounded-xl bg-white border border-line text-sm font-500 text-ink/70 hover:border-red-300 hover:text-red-600 transition flex items-center justify-center gap-1.5">
               <i data-lucide="lock" style="width:15px;height:15px"></i> Blokla
             </button>`
        }
      </div>
    </div>`;
  }).join("");

  lucide.createIcons();
}


/* ══════════════════════════════════════════════════════════════
   5. EMELLER (block / unblock / create)
   ══════════════════════════════════════════════════════════════ */
async function blockCard(id) {
  try {
    await api(`/api/Card/${id}/block`, { method: "POST" });
    showMsg("Kart bloklandı.", true);
    await loadCards();
  } catch (e) { showMsg(e.message, false); }
}

async function unblockCard(id) {
  try {
    await api(`/api/Card/${id}/unblock`, { method: "POST" });
    showMsg("Kart aktivləşdirildi.", true);
    await loadCards();
  } catch (e) { showMsg(e.message, false); }
}

document.getElementById("createForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const accountId = document.getElementById("cardAccount").value;
  if (!accountId) return showMsg("Əvvəlcə hesab lazımdır.", false);

  const btn = e.target.querySelector("button[type=submit]");
  btn.disabled = true;
  try {
    await api("/api/Card", { method: "POST", body: JSON.stringify({ accountId }) });
    closeCreate();
    showMsg("Yeni kart yaradıldı.", true);
    await loadCards();
  } catch (err) {
    showMsg(err.message, false);
  } finally {
    btn.disabled = false;
  }
});


/* ══════════════════════════════════════════════════════════════
   6. UI
   ══════════════════════════════════════════════════════════════ */
function showMsg(text, ok) {
  const el = document.getElementById("pageMsg");
  el.textContent = text;
  el.className = "mb-5 text-sm px-4 py-3 rounded-xl max-w-2xl " + (ok ? "bg-neon/10 text-teal-800" : "bg-red-50 text-red-700");
  el.classList.remove("hidden");
  window.scrollTo({ top: 0, behavior: "smooth" });
  if (ok) setTimeout(() => el.classList.add("hidden"), 5000);
}

function openCreate() {
  if (!accounts.length) return showMsg("Kart açmaq üçün əvvəlcə hesabınız olmalıdır.", false);
  document.getElementById("createModal").classList.remove("hidden");
}
function closeCreate() { document.getElementById("createModal").classList.add("hidden"); }

document.getElementById("newCardBtn").onclick = openCreate;
document.getElementById("closeCreate").onclick = closeCreate;
document.getElementById("createModal").onclick = (e) => { if (e.target.id === "createModal") closeCreate(); };

// document.querySelectorAll(".nav-soon").forEach(item => {
//   item.onclick = (e) => { e.preventDefault(); showMsg("Bu bölmə hazırlanır. Tezliklə əlçatan olacaq.", false); };
// });

document.getElementById("logoutBtn").onclick = async () => {
  try { await api("/api/Auth/logout", { method: "POST" }); } catch (e) {}
  localStorage.removeItem("token");
  localStorage.removeItem("refreshToken");
  window.location.href = "amorabank-auth.html";
};


/* ══════════════════════════════════════════════════════════════
   7. ILKIN YUKLENME
   ══════════════════════════════════════════════════════════════ */
document.addEventListener("DOMContentLoaded", async () => {
  lucide.createIcons();
  await loadProfile();
  await loadAccounts();   // kart render-i hesab tipini gostermek ucun accounts-a ehtiyac duyur
  await loadCards();
});
</script>
</body>
</html>
